[project]
name = "prompt-injection"
version = "0.1.0"
description = "Fine-tune axiotic/ogma-base on neuralchemy/Prompt-injection-dataset."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "scikit-learn>=1.3",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.23",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# No source package to ship — this project is a notebook + deps manifest.
[tool.setuptools]
py-modules = []
